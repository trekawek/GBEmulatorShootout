name: Main

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Install catalog dependency
        run: python -m pip install -r requirements-catalog.txt
      - name: Validate emulator catalog
        run: python -m catalog validate
