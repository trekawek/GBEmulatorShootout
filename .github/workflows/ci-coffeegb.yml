name: CI - Coffee GB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/emulator-runner.yml
    with:
      emulator: Coffee GB
      needs_audio: false
      needs_java: true
      timeout_minutes: 45

  deploy-pages:
    needs: run
    uses: ./.github/workflows/deploy-pages.yml
