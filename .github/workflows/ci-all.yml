name: CI - emulators

on:
  workflow_dispatch:
    inputs:
      emulator:
        description: Emulator ID from emulators/catalog.py, or all
        type: string
        required: false
        default: all
  schedule:
    # Run off the top of the hour to reduce GitHub Actions scheduling delays.
    - cron: '27 3 * * *'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Select emulators from the catalog
        id: catalog
        env:
          EMULATOR_SELECTION: ${{ inputs.emulator }}
        run: python3 -m emulators.catalog ci-matrix >> "$GITHUB_OUTPUT"

  run-all:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/emulator-runner.yml
    with:
      emulator: ${{ matrix.emulator }}
      needs_chromedriver: ${{ matrix.needs_chromedriver }}
      needs_audio: ${{ matrix.needs_audio }}
      needs_java: ${{ matrix.needs_java || false }}
      timeout_minutes: ${{ matrix.timeout_minutes || 360 }}
      extra_requirements: ${{ matrix.extra_requirements }}

  deploy-pages:
    if: ${{ always() && needs.prepare.result == 'success' && (github.event_name == 'schedule' || inputs.emulator == 'all' || needs.run-all.result == 'success') }}
    needs: [prepare, run-all]
    uses: ./.github/workflows/deploy-pages.yml
