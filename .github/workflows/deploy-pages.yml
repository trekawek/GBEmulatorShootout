name: Deploy Pages

on:
  workflow_dispatch:
    inputs:
      artifact_pattern:
        description: Results artifact pattern; leave empty to rebuild existing data
        required: false
        default: '*-results'
        type: string
      target_branch:
        description: Branch containing the generated static site
        required: false
        default: 'gh-pages-new'
        type: string
  workflow_call:
    inputs:
      artifact_pattern:
        required: false
        type: string
        default: '*-results'
      target_branch:
        required: false
        type: string
        default: 'gh-pages-new'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: python -m pip install -r requirements-core.txt

      - name: Download emulator results
        if: ${{ inputs.artifact_pattern != '' }}
        uses: actions/download-artifact@v5
        with:
          pattern: ${{ inputs.artifact_pattern }}
          path: artifacts
          merge-multiple: true

      - name: Build and commit static site update
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          git config --global user.name "github actions"
          git config --global user.email "github@actions"

          git clone --single-branch --branch "${{ inputs.target_branch }}" "https://github.com/${{ github.repository }}.git" pages
          New-Item -ItemType Directory -Force -Path site-input | Out-Null
          if (Test-Path "pages\\data\\raw\\*.json") {
            Copy-Item -Path pages\data\raw\*.json -Destination site-input -Force
          }
          if (Test-Path "artifacts\\*.json") {
            Copy-Item -Path artifacts\*.json -Destination site-input -Force
          } else {
            Write-Host "No emulator JSON artifacts found to publish."
          }

          python main.py --dump-emulators-json --dump-tests-json
          python build.py --results-dir site-input --emulators emulators.json --tests tests.json --output-dir site-output

          Get-ChildItem -Path pages -Force |
            Where-Object { $_.Name -ne ".git" } |
            Remove-Item -Recurse -Force
          Copy-Item -Path site-output\* -Destination pages -Recurse -Force
          Copy-Item -Path site-output\.nojekyll -Destination pages -Force

          Set-Location pages
          git add -A
          if (git diff --cached --quiet) {
            Write-Host "No static site changes to commit."
            exit 0
          }
          git commit -m "Update static results site"

      - name: Push static site changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ inputs.target_branch }}
          directory: pages
