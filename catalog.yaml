# Add new emulators here. IDs are used by the CLI and CI; keep them stable.
# Optional fields: aliases, site_id (defaults to id), systems (unknown by default),
# needs_audio (true), needs_chromedriver (false), needs_java (false),
# timeout_minutes (360), extra_requirements (empty).
# In systems, true means selectable, false means unsupported, and null means unknown.
emulators:
  - id: bdm
    name: Beaten Dying Moon
    url: https://mattcurrie.com/bdm-demo/
    adapter: emulators.bdm:BDM
    site_id: beaten-dying-moon
    systems:
      dmg: true
      cgb: true
      sgb: true
    aliases:
      - beaten
  - id: mgba
    name: mGBA
    url: https://mgba.io/
    adapter: emulators.mgba:MGBA
    systems:
      dmg: true
      cgb: true
